name: CI-CD

on: push

jobs:
  test-local-app:
    runs-on: ubuntu-latest
    steps:
      - name: Code Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install Packages
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Build Local Artifacts
        run: |
          python -c "from local_data import ensure_local_artifacts; print(ensure_local_artifacts())"

      - name: Run Application
        run: |
          nohup streamlit run app.py --server.port 8000 &
          sleep 30

      - name: Test App
        run: |
          pytest test_app.py

      - name: Stop Streamlit app
        if: always()
        run: |
          pkill -f "streamlit run"
