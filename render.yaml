services:
  - type: web
    name: spotify-hybrid-recommender
    runtime: python
    plan: free
    buildCommand: pip install -r requirements.txt && python -c "from local_data import ensure_local_artifacts; print(ensure_local_artifacts())"
    startCommand: streamlit run app.py --server.address 0.0.0.0 --server.port $PORT --server.headless true
    healthCheckPath: /
